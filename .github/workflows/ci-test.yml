name: CI Test

on: [push]

jobs:
  build-linux:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          miniconda-version: "latest"
      - name: Conda install clingo
        shell: bash -el {0}
        run: |
          conda install -c potassco -c conda-forge clingo=5.8.3
          echo "CLINGO_LIBRARY_PATH=$CONDA_PREFIX/lib" >> $GITHUB_ENV
      - name: Build
        run: |
          cargo build --verbose
      - name: Run tests
        run: |
          export LD_LIBRARY_PATH=$CLINGO_LIBRARY_PATH
          cargo test --verbose
  build-macos:
    runs-on: "macos-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          miniconda-version: "latest"
      - name: Conda install clingo
        shell: bash -el {0}
        run: |
          conda install -c potassco -c conda-forge clingo=5.8.3
          echo "CLINGO_LIBRARY_PATH=$CONDA_PREFIX/lib" >> $GITHUB_ENV
      - name: Build
        run: |
          cargo build --verbose
      - name: Run tests
        run: |
          export DYLD_LIBRARY_PATH=$CLINGO_LIBRARY_PATH
          cargo test --verbose
  build-windows:
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          miniconda-version: "latest"
      - name: Conda install clingo
        shell: bash -el {0}
        run: |
          conda install -c potassco -c conda-forge clingo=5.8.3
          echo "CLINGO_LIBRARY_PATH=$CONDA_PREFIX\\Library\\lib" >> $GITHUB_ENV
          echo "$CONDA_PREFIX\\Library\\bin" >> $GITHUB_PATH
      - name: Build
        run: |
          cargo build --verbose
      - name: Run tests
        run: |
          cargo test --verbose
  build-linux-static:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build
        run: cargo build --features static-linking --verbose
      - name: Run tests
        run: cargo test --features static-linking --verbose
  build-macos-static:
    runs-on: "macos-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build
        run: cargo build --features static-linking --verbose
      - name: Run tests
        run: cargo test --features static-linking --verbose
  build-windows-static:
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build
        run: cargo build --features static-linking -vv
      - name: Run tests
        run: cargo test --features static-linking --verbose
